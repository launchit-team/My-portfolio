<div style="background:#f2eee7;font-family:Arial,Helvetica,sans-serif;color:#17201c;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;background:#f2eee7;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" cellpadding="0" cellspacing="0" width="600" style="width:100%;max-width:600px;border-collapse:collapse;background:#ffffff;">
            <tr>
              <td style="padding:28px 32px;background:#17201c;color:#f2eee7;">
                <div style="font-size:28px;font-weight:700;letter-spacing:-2px;">samy°</div>
                <div style="margin-top:10px;font-size:11px;letter-spacing:2px;text-transform:uppercase;">New portfolio inquiry</div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 12px;font-size:25px;line-height:1.2;font-weight:500;">{{portfolio}} inquiry</h1>
                <p style="margin:0 0 28px;font-size:14px;line-height:1.6;color:#59615b;">A new message from {{name}} arrived through your website.</p>

                <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;font-size:14px;line-height:1.5;">
                  <tr><td style="padding:10px 12px;border-top:1px solid #e5e8e5;color:#68716b;width:38%;">Name</td><td style="padding:10px 12px;border-top:1px solid #e5e8e5;">{{name}}</td></tr>
                  <tr><td style="padding:10px 12px;border-top:1px solid #e5e8e5;color:#68716b;">Email</td><td style="padding:10px 12px;border-top:1px solid #e5e8e5;word-break:break-word;">{{email}}</td></tr>
                  <tr><td style="padding:10px 12px;border-top:1px solid #e5e8e5;color:#68716b;">{{profile_label}}</td><td style="padding:10px 12px;border-top:1px solid #e5e8e5;word-break:break-word;">{{profile}}</td></tr>
                  <tr><td style="padding:10px 12px;border-top:1px solid #e5e8e5;border-bottom:1px solid #e5e8e5;color:#68716b;">{{volume_label}}</td><td style="padding:10px 12px;border-top:1px solid #e5e8e5;border-bottom:1px solid #e5e8e5;">{{volume}}</td></tr>
                </table>

                <p style="margin:30px 0 10px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#68716b;">Message</p>
                <div style="padding:20px;background:#f7f7f4;border-left:3px solid #93816c;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word;">{{project_message}}</div>
                <p style="margin:26px 0 0;font-size:12px;line-height:1.5;color:#68716b;">Received {{date}} at {{time}}. Reply to this email to contact {{name}}.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
</div>
